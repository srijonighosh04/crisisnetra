<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E24B4A" />
    <meta name="description" content="CrisisNetra — AI-powered disaster relief coordination platform" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>CrisisNetra — Disaster Relief Coordination</title>
    <!-- Google Maps JS SDK — key is injected at build time via REACT_APP_GOOGLE_MAPS_API_KEY -->
    <script>
      window.__MAPS_API_KEY__ = "%REACT_APP_GOOGLE_MAPS_API_KEY%";
    </script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=%REACT_APP_GOOGLE_MAPS_API_KEY%&libraries=drawing,geometry"
      async
      defer
    ></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f9f9f8; }
    </style>
  </head>
  <body>
    <noscript>CrisisNetra requires JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
